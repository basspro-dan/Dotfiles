name: Build and Push to ACR
on:
  workflow_dispatch:
  push:
    branches:
      - 'Kore'
jobs:
  build:
    name: 'Build and Push to ACR'
    runs-on: Ubuntu-latest
    permissions:
      contents: write
      packages: write

    defaults:
      run:
        shell: bash
        
    steps:
      - name: view the secrets context
        shell: bash
        run: echo "$SECRETS_CONTEXT"
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}

      - name: Set ACR_LOGIN_SERVER env
        run: echo "ACR_LOGIN_SERVER=${{ secrets.ACR_LOGIN_SERVER }}" >> $GITHUB_ENV

      - name: Set ACR_USERNAME env
        run: echo "ACR_USERNAME=${{ secrets.ACR_USERNAME }}" >> $GITHUB_ENV

      - name: Set ACR_PASSWORD env
        run: echo "ACR_PASSWORD=${{ secrets.ACR_PASSWORD }}" >> $GITHUB_ENV

      - name: Set ACR_IMAGE_TAG env
        run: echo "ACR_IMAGE_TAG=${{ secrets.ACR_IMAGE_TAG }}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check env
        run: printenv


      - name: Azure Login
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }} 
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push to ACR
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/${{ secrets.ACR_IMAGE_TAG }}:latest
          file: Dockerfile

# Clean up. Have confirmed the secrets are geting into the envs.